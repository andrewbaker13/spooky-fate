<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fate">
<meta name="theme-color" content="#070307">
<title>Spooky Fate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>
/* Layout: one fixed set piece filling the screen. A fortune-teller's table: curtains at the edges, a velvet cloth in the lower third,
   the orb on its brass cradle centered on the cloth with a nameplate button, and the fate written in glowing ink in the dark above. */
:root{
  --velvet:#070307;
  --cloth:#1c0715;
  --brass:#c39d5a;
  --brass-dim:#6d5333;
  --bone:#efe3ca;
  --bone-dim:#a99a82;
  --ecto:#93e6d2;
  --aura:var(--ecto);
  --heat:0;
  --dim:1;
  --glass-core:#0f1b20;
  --glass-edge:#07080d;
  --f-body:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-label:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --d:min(62vw, 44vh, 500px);
  --floor:11vh;
  --e:0;
  color-scheme:dark;
}
html,body{height:100%; overscroll-behavior:none}
[hidden]{display:none!important}
body{
  margin:0; overflow:hidden;
  background:var(--velvet); color:var(--bone);
  font-family:var(--f-body); line-height:1.4;
  touch-action:manipulation; -webkit-touch-callout:none;
  user-select:none; -webkit-user-select:none;
}
.scene{position:fixed; inset:0; overflow:hidden}

/* Set dressing */
.backdrop{
  position:absolute; inset:0;
  background:
    radial-gradient(60% 50% at 50% 30%, rgba(48,14,36,.4), transparent 75%),
    var(--velvet);
}
/* the orb's glow on the room: its own layer, so breathing only changes its opacity (no repaint) */
.backdrop::before{
  content:""; position:absolute; inset:0;
  background:radial-gradient(50% 40% at 50% 62%, rgba(147,230,210,.16), transparent 70%);
  opacity:calc(.25 + var(--e) * .75); will-change:opacity;
}
/* a cold shaft of light falling on the orb from somewhere above */
.beam{
  position:absolute; left:50%; top:-4%;
  width:calc(var(--d) * 1.6); height:calc(100% - var(--floor) - var(--d) * .7);
  transform:translateX(-50%);
  filter:blur(16px); will-change:opacity;   /* blurred once, then only faded */
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 25%, #000 62%, transparent 92%);
  mask-image:linear-gradient(180deg, transparent 0, #000 25%, #000 62%, transparent 92%);
  animation:beam 7s ease-in-out infinite;
}
.beam::before{
  content:""; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(170,215,225,.07) 30%, rgba(190,230,235,.1) 50%, rgba(170,215,225,.07) 70%, transparent);
  clip-path:polygon(42% 0, 58% 0, 100% 100%, 0 100%);
}
@keyframes beam{0%,100%{opacity:.8} 50%{opacity:1} 70%{opacity:.65}}
/* shadows that creep slowly across the room */
.gloom{
  position:absolute; inset:-20%; pointer-events:none;
  background:
    radial-gradient(35% 30% at 20% 30%, rgba(0,0,0,.6), transparent 70%),
    radial-gradient(30% 35% at 80% 25%, rgba(0,0,0,.55), transparent 70%),
    radial-gradient(40% 25% at 60% 75%, rgba(0,0,0,.45), transparent 70%);
  animation:creep 38s ease-in-out infinite alternate; will-change:transform;
}
@keyframes creep{from{transform:translate(-4%, -2%) scale(1)} to{transform:translate(5%, 3%) scale(1.08)}}
/* the summoning circle, laid flat on the table in perspective */
.sigil{
  position:absolute; z-index:2; left:50%; bottom:calc(var(--floor) - var(--d) * 1.2);
  width:calc(var(--d) * 2.6); aspect-ratio:1; max-width:none; pointer-events:none;
  transform:translateX(-50%) perspective(calc(var(--d) * 4)) rotateX(76deg);
  fill:none; stroke-width:.9; stroke-linecap:round; stroke-linejoin:round;
}
/* carved into the table: always there, barely catching the light */
.sigil.carved{stroke:rgba(150,200,180,.17)}
/* its twin, which kindles as the orb is worked */
.sigil.glow{
  stroke:var(--aura); stroke-width:1;
  opacity:calc(var(--e) * .85 + var(--heat) * .6); will-change:opacity;
  filter:drop-shadow(0 0 3px var(--aura)) drop-shadow(0 0 9px var(--aura));
}
/* lite: no blurred beam, no filtered glow on the circle, no animated shadows, and the words fade without a blur */
.lite .beam{display:none}
.lite .gloom{animation:none; will-change:auto}
.lite .sigil.glow{filter:none; stroke-width:1.6}
.lite .fate-text .w{animation-name:condenseLite}
@keyframes condenseLite{0%{opacity:0; transform:translateY(10px) scale(1.12)} 45%{opacity:.25} 100%{opacity:1; transform:none}}
/* what waits behind the room */
#deep,#reach{position:absolute; inset:0; width:100%; height:100%; filter:var(--dimf, none)}
.vignette{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 50% 56%, transparent 38%, rgba(0,0,0,.55) 74%, rgba(0,0,0,.88) 100%);
}
.curtain{
  position:absolute; top:-2%; bottom:0; width:max(70px, 15vw);
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.78) 0, rgba(58,14,38,.5) 1.6vw, rgba(22,4,15,.78) 2.6vw, rgba(0,0,0,.82) 3.6vw);
}
.curtain.l{left:0; -webkit-mask-image:linear-gradient(90deg, #000 30%, transparent); mask-image:linear-gradient(90deg, #000 30%, transparent)}
.curtain.r{right:0; -webkit-mask-image:linear-gradient(270deg, #000 30%, transparent); mask-image:linear-gradient(270deg, #000 30%, transparent)}
.curtain::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(195,157,90,.05), transparent 8%, transparent 70%, rgba(0,0,0,.75));
}
.table{
  position:absolute; left:-12%; right:-12%; bottom:-2vh; height:calc(var(--floor) + 22vh);
  border-radius:50% 50% 0 0 / 34% 34% 0 0;
  background:radial-gradient(70% 90% at 50% 0%, #10211e, #091412 40%, #020605 85%);
  box-shadow:inset 0 2px 0 rgba(120,190,160,.16), inset 0 8px 0 rgba(0,0,0,.45), 0 -30px 80px rgba(0,0,0,.85);
}
.tglow{
  position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(40% 55% at 50% 40%, rgba(147,230,210,.23), transparent 70%);
  opacity:calc((.03 + var(--e) * .2) / .23); will-change:opacity;
}
.table::before{
  content:""; position:absolute; inset:5% 8% 0;
  border-radius:inherit;
  background-image:radial-gradient(circle at 50% 0, transparent 56%, rgba(120,200,170,.075) 61%, transparent 69%);
  background-size:30px 17px;
  -webkit-mask-image:radial-gradient(60% 80% at 50% 10%, #000, transparent 75%);
  mask-image:radial-gradient(60% 80% at 50% 10%, #000, transparent 75%);
}

/* The orb apparatus */
.stage{
  position:absolute; left:50%; bottom:var(--floor); z-index:3;
  transform:translateX(-50%);
  display:flex; flex-direction:column; align-items:center;
}
.stage::after{
  content:""; position:absolute; bottom:-1.4vh; left:50%; z-index:-1;
  width:calc(var(--d) * 1.45); height:calc(var(--d) * .2);
  transform:translateX(-50%);
  background:radial-gradient(ellipse, rgba(0,0,0,.7), transparent 70%);
}
.orb{
  position:relative; width:var(--d); padding-top:13px;
  display:flex; flex-direction:column; align-items:center;
  touch-action:none; -webkit-tap-highlight-color:transparent;
}
.orb:focus-visible{outline:none}
.orb:focus-visible .glass{outline:2px solid var(--ecto); outline-offset:8px}
.aura{
  position:absolute; top:13px; left:0; width:var(--d); aspect-ratio:1; border-radius:50%;
  box-shadow:0 0 100px 28px var(--aura);
  opacity:calc(.1 + var(--e) * .7);
  transform:scale(calc(.92 + var(--e) * .1)); will-change:opacity, transform;
}
/* Runes cut into the cradle: they kindle as the orb charges, then cool like embers */
.rune path{fill:none; stroke-linecap:round; stroke-linejoin:round}
.rune .cut{stroke:#2c1e0f; stroke-width:1.5; opacity:.7}
.rune .lit{stroke:var(--aura); stroke-width:1.6; opacity:0}
.stand.cooling .rune .lit{stroke:#ff9448}
.glass{
  position:relative; z-index:2; width:var(--d); aspect-ratio:1; border-radius:50%;
  overflow:hidden; cursor:grab;
  background:radial-gradient(circle at 50% 58%, var(--glass-core), var(--glass-edge) 74%);
}
.orb.rubbing .glass{cursor:grabbing}
.glass canvas{position:absolute; inset:0; width:100%; height:100%}
.shine{
  position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:
    radial-gradient(13% 8% at 34% 19%, rgba(255,255,255,.72), rgba(255,255,255,.16) 55%, transparent 72%),
    radial-gradient(34% 26% at 34% 24%, rgba(255,255,255,.14), transparent 70%),
    radial-gradient(4% 3% at 73% 77%, rgba(255,240,220,.5), transparent 70%),
    radial-gradient(42% 16% at 56% 87%, rgba(170,240,225,.2), transparent 70%),
    radial-gradient(130% 62% at 50% 128%, rgba(14,4,12,.42) 0, rgba(26,8,22,.32) 45%, rgba(195,157,90,.2) 47.5%, transparent 49.5%),
    radial-gradient(circle at 50% 50%, transparent 78%, rgba(0,0,0,.32) 90%, rgba(200,240,235,.2) 97.4%, rgba(255,255,255,.32) 99%, rgba(0,0,0,.6) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset -24px -34px 80px rgba(0,0,0,.65),
    inset 14px 18px 46px rgba(255,255,255,.06);
}
.glass::after{
  content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(236,255,250,.95), rgba(147,230,210,.4) 40%, transparent 68%);
  opacity:0;
}
.orb.flash .glass::after{animation:flash 1.2s ease-out}
@keyframes flash{0%{opacity:0} 10%{opacity:.9} 100%{opacity:0}}
.orb.shake .glass{animation:shake 1s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-1px,0) rotate(-.4deg)}
  20%,80%{transform:translate(3px,-1px) rotate(.8deg)}
  30%,50%,70%{transform:translate(-5px,1px) rotate(-1.4deg)}
  40%,60%{transform:translate(5px,-1px) rotate(1.4deg)}
}
.stand-back{
  position:absolute; z-index:1; left:50%; top:calc(13px + var(--d) * .89);
  width:calc(var(--d) * .8); max-width:none; transform:translateX(-50%);
  pointer-events:none;
}
.stand{
  position:relative; z-index:3; width:calc(var(--d) * .8); max-width:none;
  margin-top:calc(var(--d) * -.11);
  pointer-events:none;
}

/* The orb's stand rests on an ebony plinth banded in brass. Set into the plinth's front is the button: a brass
   push-plate in a curved niche, engraved along the curve of the drum. It sinks when pressed and stays locked down
   while the orb rests; the hourglass standing beside it is turned over and runs the rest out, and when its sand has
   run through the plate springs back up. */
.orb{z-index:2}
.plinth{
  position:relative; z-index:1; width:calc(var(--d) * 1.1); aspect-ratio:500 / 150;
  margin-top:calc(var(--d) * -.142);
}
.plinth-art{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
.plinth .plate{transition:transform .35s cubic-bezier(.3,1.9,.5,1), filter .35s}
.plinth.locked .plate{transform:translateY(3.5px); filter:brightness(.62) saturate(.8); transition:transform .1s ease-in, filter .3s}
.plinth:has(.plaque:active:not(:disabled)) .plate{transform:translateY(3.5px); transition:transform .06s}
.plinth:has(.plaque:hover:not(:disabled)) .plate{filter:brightness(1.08)}
.plinth .ptext{font-family:var(--f-label); font-size:19px; letter-spacing:1.4px}
.plinth .beckon{position:absolute; left:18.6%; width:62.8%; top:49%; height:42%; border-radius:12% / 40%; pointer-events:none;
  box-shadow:0 0 14px 3px var(--aura); will-change:opacity; animation:beckon 3.2s ease-in-out infinite}
.plinth.locked .beckon{animation:none; opacity:0}
@keyframes beckon{0%,100%{opacity:.08} 50%{opacity:.8}}
.hourglass{
  position:absolute; z-index:2; left:calc(50% + var(--d) * .56); bottom:calc(var(--d) * .025);
  width:calc(var(--d) * .225); aspect-ratio:120 / 222; overflow:visible; pointer-events:none;
}
.hourglass .hgbody{transform-box:fill-box; transform-origin:50% 50%}
.plaque{
  position:absolute; left:19%; width:62%; top:50%; height:46.7%;
  margin:0; padding:0; border:0; background:transparent; border-radius:40%;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.plaque:disabled{cursor:default}
.plaque:focus-visible{outline:2px solid var(--ecto); outline-offset:4px}

/* The writing in the air */
.oracle{
  position:absolute; z-index:7; left:50%; transform:translateX(-50%);
  top:max(3vh, 16px);
  bottom:calc(var(--floor) + var(--d) * 1.45 + 2vh);
  width:min(92vw, 60rem);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; pointer-events:none;
}
/* dropped for now: the status line and the witness line (remove this rule to bring them back) */
.whisper,.witness{display:none!important}
.whisper{
  margin:0; font-style:italic; color:var(--bone-dim);
  font-size:clamp(1.05rem, min(2.8vw, 3vh), 1.6rem);
  text-shadow:0 0 16px rgba(147,230,210,.3);
  animation:breathe 4.5s ease-in-out infinite;
  transition:opacity .5s;
}
@keyframes breathe{0%,100%{opacity:.55} 50%{opacity:1}}
.fate{display:flex; flex-direction:column; align-items:center; gap:.9rem; transition:opacity .5s, filter .5s}
.fate.fading{opacity:0; filter:blur(8px)}
.fate-text{
  margin:0; font-size:clamp(1.5rem, min(5vw, 5.5vh), 3.6rem); line-height:1.24;
  color:var(--bone); text-wrap:balance;
  text-shadow:0 0 18px rgba(147,230,210,.45), 0 0 3px rgba(239,227,202,.6);
}
.fate-text .w{display:inline-block; animation:condense 1.3s ease-in-out both; animation-delay:var(--d, 0ms)}
.fate-text.measuring .w{animation:none}
@keyframes condense{0%{opacity:0; filter:blur(16px); transform:translateY(10px) scale(1.18)} 35%{opacity:.12; filter:blur(10px)} 70%{opacity:.7; filter:blur(3px)} 100%{opacity:1; filter:none; transform:none}}
@keyframes ink{from{opacity:0; filter:blur(10px); transform:translateY(8px)} to{opacity:1; filter:none; transform:none}}
.witness{
  margin:0; font-family:var(--f-label); color:var(--brass);
  font-size:clamp(.85rem, min(1.9vw, 2.1vh), 1.2rem); letter-spacing:.16em;
  animation:ink 1.2s ease-out both;
}

/* A natural 20: the orb inhales, detonates, cracks, and sets the room on fire */
.backdrop,.table{filter:var(--dimf, none)}
.curtain{filter:var(--curf, none)}
.blast{
  position:absolute; inset:0; z-index:6; pointer-events:none; opacity:0;
  background:radial-gradient(60% 60% at 50% 58%, rgba(255,255,240,1), rgba(255,175,60,.9) 32%, rgba(225,45,0,.55) 62%, rgba(120,0,0,0) 90%);
}
.scene.erupt .blast{animation:blast 2.1s ease-out}
@keyframes blast{0%{opacity:0} 4%{opacity:1} 22%{opacity:.8} 100%{opacity:0}}
.scene.erupt{animation:quake 1.5s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{
  4%{transform:scale(1.035)}
  10%,90%{transform:translate(-4px,2px) rotate(-.3deg)}
  20%,80%{transform:translate(11px,-6px) rotate(.6deg)}
  30%,50%,70%{transform:translate(-17px,9px) rotate(-.9deg) scale(1.01)}
  40%,60%{transform:translate(17px,-9px) rotate(.9deg)}
}
.scene::after{
  content:""; position:absolute; inset:0; z-index:5; pointer-events:none;
  box-shadow:inset 0 0 150px 46px rgba(255,80,10,.55), inset 0 0 44px 8px rgba(255,190,90,.35);
  opacity:var(--heat);
}
.backdrop::after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(55% 50% at 50% 62%, rgba(255,100,30,.3), transparent 70%);
  opacity:var(--heat);
}
.table::after{
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:radial-gradient(40% 55% at 50% 30%, rgba(255,110,40,.3), transparent 70%);
  opacity:var(--heat);
}
.scene.fire::after,.scene.fire .backdrop::after{animation:flick .9s ease-in-out infinite}
@keyframes flick{0%,100%{filter:brightness(1)} 30%{filter:brightness(1.3)} 55%{filter:brightness(.75)} 75%{filter:brightness(1.12)}}
.whisper.nat20{
  font-family:var(--f-label); font-style:normal; letter-spacing:.06em; line-height:1;
  font-size:clamp(2.6rem, min(9vw, 11vh), 7rem);
  color:#ffe2b0;
  text-shadow:0 0 8px #ffb347, 0 0 24px #ff6a1a, 0 0 60px #d42000, 0 0 110px #8a0a00;
  animation:nat20 2.2s cubic-bezier(.2,.7,.2,1) both, burn .14s steps(2) infinite;
}
@keyframes nat20{from{transform:scale(2.4); opacity:0; filter:blur(14px)} 12%{transform:scale(1); opacity:1; filter:none} to{transform:scale(1.07)}}
@keyframes burn{50%{text-shadow:0 0 6px #ffd27a, 0 0 32px #ff7a2a, 0 0 74px #e83000, 0 0 130px #8a0a00}}
.fate.fire .fate-text{color:#ffeccc; animation:smoulder 1.8s ease-in-out infinite}
@keyframes smoulder{
  0%,100%{text-shadow:0 0 20px rgba(255,110,30,.75), 0 0 4px rgba(255,214,150,.8)}
  50%{text-shadow:0 0 36px rgba(255,80,10,.95), 0 0 6px rgba(255,230,170,.95)}
}
.fate.fire .witness{color:#ff9a4a}
.fate.fizzle .fate-text{color:var(--bone-dim); text-shadow:none}
.fate.fizzle .witness{color:var(--bone-dim)}

/* Test panel (open the page with #dev) */
.devpanel{
  position:fixed; z-index:20; top:calc(env(safe-area-inset-top, 0px) + 10px); left:10px;
  display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; max-width:calc(100vw - 20px);
  padding:8px 10px; background:rgba(10,4,10,.85); border:1px solid var(--brass-dim); border-radius:6px;
  font:12px/1.2 system-ui, -apple-system, sans-serif; color:var(--bone); user-select:auto; -webkit-user-select:auto;
}
.devpanel label{display:flex; gap:5px; align-items:center}
.devpanel select{max-width:230px; font:inherit; background:#1d0f1a; color:var(--bone); border:1px solid var(--brass-dim); border-radius:4px; padding:3px 4px}
/* Sound board (from the test panel) */
.soundboard{
  position:fixed; z-index:21; top:calc(env(safe-area-inset-top, 0px) + 54px); left:10px;
  width:min(440px, calc(100vw - 20px)); max-height:calc(100vh - 80px); overflow:auto;
  padding:10px 12px; background:rgba(10,4,10,.95); border:1px solid var(--brass-dim); border-radius:8px;
  font:12px/1.35 system-ui, -apple-system, sans-serif; color:var(--bone); user-select:auto; -webkit-user-select:auto;
}
.sb-head{display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; margin-bottom:6px}
.sb-head strong{font-size:13px}
.sb-head span{color:var(--bone-dim); flex:1 1 100%}
.sb-group{margin:12px 0 2px; font-weight:600; color:var(--brass); letter-spacing:.04em}
.sb-row{display:grid; grid-template-columns:auto minmax(0, 1fr); gap:1px 10px; align-items:start; padding:6px 0; border-top:1px solid rgba(109,83,51,.35)}
.sb-row button,#devBoard{font:inherit; background:#1d0f1a; color:var(--bone); border:1px solid var(--brass-dim); border-radius:5px; cursor:pointer}
.sb-row button{grid-row:span 2; min-width:72px; min-height:34px; padding:2px 8px}
#devBoard{padding:3px 8px}
.sb-name{font-weight:600}
.sb-when{color:var(--bone-dim)}
.devpanel button{font:inherit; background:none; border:0; color:var(--bone-dim); cursor:pointer; padding:2px 4px}

/* The fizzle: a rattle of solid glass, and the orb glitching */
.orb.rattle .glass{animation:rattle .45s linear}
@keyframes rattle{0%,100%{transform:none} 15%{transform:translate(-2px,1px) rotate(-.4deg)} 30%{transform:translate(2px,-1px) rotate(.4deg)} 45%{transform:translate(-1.5px,0)} 60%{transform:translate(1.5px,1px)} 75%{transform:translate(-.8px,0)} 90%{transform:translate(.5px,0)}}
.orb.glitching .glass{animation:orbglitch 1.6s steps(1) both}
@keyframes orbglitch{0%{filter:none} 6%{filter:hue-rotate(90deg) saturate(3)} 12%{filter:invert(1)} 18%{filter:contrast(3) hue-rotate(-60deg)} 26%{filter:none} 32%{filter:hue-rotate(180deg) saturate(4)} 38%{filter:none} 56%{filter:invert(1) contrast(2)} 62%{filter:brightness(2)} 70%{filter:none} 78%{filter:hue-rotate(270deg) saturate(3)} 86%{filter:invert(1)} 92%{filter:contrast(2)} 100%{filter:none}}

#fog{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5}

@media (max-width:600px){ .curtain{width:40px} }
@media (prefers-reduced-motion: reduce){
  .whisper,.plinth .beckon{animation:none}
  .beam,.gloom,.orb.glitching .glass,.orb.rattle .glass,.scene.erupt,.whisper.nat20,.scene.fire::after,.scene.fire .backdrop::after,.fate.fire .fate-text{animation:none}
  .fate-text .w{animation:fade .6s both; animation-delay:0s}
  .witness{animation:fade .6s both}
  @keyframes fade{from{opacity:0} to{opacity:1}}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="backdrop" aria-hidden="true"></div>
  <canvas id="deep" aria-hidden="true"></canvas>
  <div class="gloom" aria-hidden="true"></div>

function drawFog(dt){
  const c = fctx;

  const oc = orbCenter();
  for (let i = fog.length - 1; i >= 0; i--){
    const p = fog[i];

      c.globalAlpha = .9 * fade;
      s = p.size * dpr;

    if (p.wisp){

      const k = Math.min(1, p.age / p.travel), settle = Math.max(0, (p.age - p.travel) / (p.life - p.travel));
      const at = q => {
        const e = q * q * (3 - 2 * q), u = 1 - e, sw = Math.sin(q * 7 + p.ph) * p.sw * (1 - q);
        return [u * u * u * p.sx + 3 * u * u * e * p.c1x + 3 * u * e * e * p.c2x + e * e * e * p.tx + sw,

      }

      c.globalAlpha = .35 * al;
      c.drawImage(p.hot ? SPR.flame : SPR.white, x * dpr - s / 2, y * dpr - s / 2, s, s);

    }
    if (p.spark){
      p.vx *= 1 - dt * .8; p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.bounce && p.vy > 0 && p.b < 3){
        const ty = innerHeight * .69 + Math.pow((p.x - innerWidth / 2) / (innerWidth * .62), 2) * innerHeight * .11;
        if (p.y > ty){ p.y = ty; p.vy *= -.38; p.vx *= .7; p.b++; }

      const row = document.createElement("div"); row.className = "sb-row";
      const b = document.createElement("button"); b.type = "button";
      const nm = document.createElement("div"); nm.className = "sb-name"; nm.textContent = name;
      const wh = document.createElement("div"); wh.className = "sb-when"; wh.textContent = when;
      if (fn === "drone"){
        b.textContent = "Mute";
        b.addEventListener("click", () => {
          sndInit();
          if (!SND.amb) return;
          const muted = b.textContent === "Unmute";
          SND.amb.gain.setTargetAtTime(muted ? .05 : 0, SND.ctx.currentTime, .1);
          b.textContent = muted ? "Mute" : "Unmute";
        });
      } else {
        b.textContent = "▶ Play";
        b.addEventListener("click", () => { sndInit(); setTimeout(fn, 30); });
      }
      row.append(b, nm, wh); list.append(row);
    });
  });
  $("devBoard").addEventListener("click", () => { $("soundboard").hidden = !$("soundboard").hidden; });
  $("sbClose").addEventListener("click", () => { $("soundboard").hidden = true; });
}

requestAnimationFrame(frame);

// Kiosk: keep the screen awake while the page is showing (ignored where unsupported)
let wake = null;
async function keepAwake(){
  try {
    if (!wake && document.visibilityState === "visible" && navigator.wakeLock){
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => { wake = null; });
    }
  } catch (_) {}
}
document.addEventListener("visibilitychange", keepAwake);
addEventListener("pointerdown", keepAwake);
keepAwake();
// ---------- Kiosk: built to run all night with nobody minding it ----------
// The preview tools only appear with #dev on the address; visitors never see them.
if (!/dev/.test(location.hash)){ $("devpanel").hidden = true; $("soundboard").hidden = true; }
if (location.hash === "#reset") try { localStorage.removeItem("sf-low"); localStorage.removeItem("sf-mode"); } catch (_) {}
// No lock and no earlier verdict: watch a few quiet seconds (after the page has settled) and decide once.
if (!MODE_LOCK && !MODE_SAVED){
  let n = 0, sum = 0, prev = 0;
  const from = performance.now() + 3000, to = from + 4000;
  (function probe(now){
    if (document.visibilityState === "visible" && state === "idle" && !rubbing && now > from && prev){
      const d = now - prev;
      if (d < 250){ sum += d; n++; }
    }
    prev = now;
    if (now < to || n < 60) return requestAnimationFrame(probe);
    const lite = sum / n > 30;   // under ~33 frames a second while idle: this device wants the lighter build
    try { localStorage.setItem("sf-mode", lite ? "lite" : "full"); } catch (_) {}
    if (lite) location.reload();
  })(performance.now());
}
// No pinch-zoom, long-press menus, double-tap zoom or two-finger scrolling: a poking hand can't knock the scene askew.
["gesturestart", "gesturechange", "contextmenu", "dblclick"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// iOS can interrupt the sound (a notification, Siri, a Bluetooth speaker dozing off); take it back whenever allowed.
const sndRevive = () => { if (SND.ctx && SND.ctx.state !== "running" && SND.ctx.state !== "closed") SND.ctx.resume().catch(() => {}); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sndRevive(); });
// A heartbeat that watches the animation, the errors and the frame rate.
const BOOT_AT = performance.now();
let beatAt = performance.now(), errCount = 0, slowWin = 0, winT = 0, winN = 0, refreshWanted = false, refreshTried = 0;
addEventListener("error", () => { if (++errCount > 25) refreshWanted = true; });
addEventListener("unhandledrejection", () => { if (++errCount > 25) refreshWanted = true; });
(function beat(now){
  const d = now - beatAt; beatAt = now;
  if (d < 250 && state === "idle"){
    // a sustained crawl (an iPad cooking in its frame) means: come back at a lighter resolution
    winT += d; winN++;
    if (winT > 10000){
      slowWin = winT / winN > 45 ? slowWin + 1 : 0; winT = winN = 0;
      if (slowWin >= 3){ try { localStorage.setItem("sf-low", "1"); } catch (_) {} refreshWanted = true; slowWin = 0; }
    }
  }
  requestAnimationFrame(beat);
})(performance.now());
// A small frame-rate readout for checking a screen before the night. Turn it on or off with the F key, by holding a
// finger on the top-left corner of the screen for two seconds, or by opening the page with #fps on the address.
let fpsMeter = null;
function toggleFps(){
  if (fpsMeter){ fpsMeter.el.remove(); fpsMeter.on = false; fpsMeter = null; return; }
  const el = document.createElement("div");
  el.style.cssText = "position:fixed;right:8px;bottom:8px;z-index:9999;font:13px/1.3 system-ui,sans-serif;color:#9fe;background:rgba(0,0,0,.7);padding:5px 8px;border-radius:4px;pointer-events:none;white-space:nowrap";
  el.textContent = "measuring…";
  document.body.appendChild(el);
  const m = fpsMeter = { el, on: true };
  let n = 0, t0 = performance.now(), worst = 0, prev = t0, worstEver = 0;
  (function tick(now){
    if (!m.on) return;
    const d = now - prev; prev = now; n++;
    if (d < 1000){ worst = Math.max(worst, d); worstEver = Math.max(worstEver, d); }
    if (now - t0 >= 1000){
      el.textContent = `${Math.round(n * 1000 / (now - t0))} fps · worst ${Math.round(worst)} ms (session ${Math.round(worstEver)}) · code ${frameJS.toFixed(1)} ms · ${LITE ? "lite" : "full"}${MODE_LOCK ? " (locked)" : ""} · res ${Math.round(RS * 100)}% · ${fogC.width}×${fogC.height}`;
      n = 0; worst = 0; t0 = now;
    }
    requestAnimationFrame(tick);
  })(t0);
}
if (/fps/.test(location.hash)) toggleFps();
addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey && !e.altKey) toggleFps(); });
{
  let hold = null;
  addEventListener("pointerdown", e => { if (e.clientX < 70 && e.clientY < 70) hold = setTimeout(toggleFps, 2000); }, true);
  ["pointerup", "pointercancel", "pointermove"].forEach(ev => addEventListener(ev, e => {
    if (hold && (ev !== "pointermove" || e.clientX > 90 || e.clientY > 90)){ clearTimeout(hold); hold = null; }
  }, true));
}
// Reload only when it is safe and quiet, and only if the page can actually be fetched: offline, it keeps running as it is.
function quietRefresh(){
  const now = performance.now();
  if (state !== "idle" || rubbing || energy > .05 || now - lastTouchAt < 120000 || now - refreshTried < 60000) return;
  refreshTried = now;
  fetch(location.href, { cache: "no-store" }).then(r => { if (r.ok) location.reload(); }).catch(() => {});
}
setInterval(() => {
  const now = performance.now();
  sndRevive();
  // the animation has stalled while on screen: start over
  if (document.visibilityState === "visible" && now - beatAt > 10000) { location.reload(); return; }
  // every few hours, a fresh start between visitors clears whatever Safari has been hoarding
  if (refreshWanted || now - BOOT_AT > 3 * 3600e3) quietRefresh();
}, 5000);
})();
</script>
